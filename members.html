<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>Members | ClassyDate</title>
    <meta name="description" content="Browse ClassyDate members and find meaningful connections.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f3e8ff;
            color: #1a0533;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }

        /* ============================================================ */
        /* HEADER - MODERN PURPLE THEME                                */
        /* ============================================================ */
        .cb-shell-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(108, 60, 179, 0.12);
        }

        .cb-shell-header__inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cb-shell-brand {
            display: flex;
            align-items: center;
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 24px;
            font-weight: 700;
            color: #1a0533;
            margin-left: -4px;
            padding-left: 0;
        }

        .cb-shell-brand .heart {
            color: #ff0000;
            display: inline-block;
        }

        .cb-shell-brand span {
            font-family: "Inter", sans-serif;
            font-weight: 300;
            color: #6c3cb3;
        }

        /* ============================================================ */
        /* HAMBURGER MENU                                              */
        /* ============================================================ */
        .menu-container {
            position: relative;
            display: inline-block;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 12px;
            font-size: 28px;
            color: #1a0533;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .menu-btn:hover {
            background: rgba(108, 60, 179, 0.08);
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            min-width: 180px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            z-index: 200;
        }

        .menu-dropdown.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-dropdown a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: #1a0533;
            font-size: 14px;
            font-weight: 500;
            font-family: "Inter", sans-serif;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(108, 60, 179, 0.06);
        }

        .menu-dropdown a:last-child {
            border-bottom: none;
        }

        .menu-dropdown a:hover {
            background: rgba(108, 60, 179, 0.06);
        }

        .menu-dropdown .logout-btn {
            color: #dc3545;
            font-weight: 600;
        }

        .menu-dropdown .logout-btn:hover {
            background: rgba(220, 53, 69, 0.06);
        }

        /* ============================================================ */
        /* ACTIVITY TICKER - HOT & CATCHY                             */
        /* ============================================================ */
        .activity-ticker {
            position: fixed;
            top: 72px;
            left: 0;
            right: 0;
            z-index: 99;
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            padding: 10px 0;
            overflow: hidden;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(108, 60, 179, 0.3);
        }

        .activity-ticker::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer-ticker 4s infinite;
        }

        @keyframes shimmer-ticker {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(50%); }
        }

        .ticker-content {
            display: flex;
            align-items: center;
            white-space: nowrap;
            animation: ticker-scroll 25s linear infinite;
            gap: 60px;
            padding: 0 20px;
        }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            font-family: "Inter", sans-serif;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .ticker-item .heart-pulse {
            display: inline-block;
            animation: heart-beat 1.2s infinite;
            font-size: 16px;
        }

        @keyframes heart-beat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.15); }
        }

        .ticker-item .fire-icon {
            font-size: 16px;
            display: inline-block;
            animation: fire-flicker 0.8s infinite alternate;
        }

        @keyframes fire-flicker {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }

        .ticker-item .time-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ticker-item .name-highlight {
            color: #ffdd57;
            font-weight: 700;
        }

        .ticker-item .name-highlight2 {
            color: #ff9ff3;
            font-weight: 700;
        }

        .ticker-item .separator {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }

        .ticker-item .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6b6b;
            animation: live-pulse 1s infinite;
            margin-right: 2px;
        }

        @keyframes live-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .ticker-item .sparkle {
            font-size: 14px;
            animation: sparkle 1.5s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        /* Pause on hover */
        .activity-ticker:hover .ticker-content {
            animation-play-state: paused;
        }

        /* ============================================================ */
        /* MEMBERS WRAPPER                                             */
        /* ============================================================ */
        .members-wrapper {
            flex: 1;
            padding: 130px 0 60px;
            max-width: 100%;
            margin: 0;
            width: 100%;
        }

        .members-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
            padding: 0 16px;
        }

        .members-header h1 {
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 28px;
            color: #1a0533;
            font-weight: 700;
        }

        .members-header .member-count {
            color: rgba(26, 5, 51, 0.5);
            font-size: 14px;
            font-family: "Inter", sans-serif;
        }

        .members-header .member-count strong {
            color: #1a0533;
            font-weight: 700;
        }

        .view-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid rgba(108, 60, 179, 0.12);
        }

        .view-toggle button {
            padding: 6px 14px;
            background: none;
            border: none;
            border-radius: 8px;
            color: rgba(26, 5, 51, 0.4);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: "Inter", sans-serif;
            font-weight: 600;
        }

        .view-toggle button.active {
            background: #6c3cb3;
            color: #fff;
        }
        .view-toggle button:hover:not(.active) {
            color: rgba(26, 5, 51, 0.7);
        }

        /* ============================================================ */
        /* GRID                                                        */
        /* ============================================================ */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            padding: 0;
            width: 100%;
        }

        /* ============================================================ */
        /* MEMBER CARD                                                 */
        /* ============================================================ */
        .member-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            overflow: hidden;
            border: 1px solid rgba(108, 60, 179, 0.08);
            transition: all 0.4s ease;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
            border-radius: 0;
            position: relative;
        }

        .member-card:hover {
            transform: translateY(-2px);
            border-color: rgba(108, 60, 179, 0.2);
            box-shadow: 0 4px 16px rgba(108, 60, 179, 0.1);
        }

        .member-card.long-press {
            background: rgba(108, 60, 179, 0.08);
            transform: scale(0.98);
        }

        /* ============================================================ */
        /* IMAGE WRAPPER                                               */
        /* ============================================================ */
        .member-card__image-wrapper {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1/1;
            background: #e8d5f5;
            max-height: 200px;
            width: 100%;
        }

        .member-card__image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .member-card:hover .member-card__image-wrapper img {
            transform: scale(1.03);
        }

        .carousel-slides {
            display: flex;
            transition: transform 0.8s ease;
            height: 100%;
            width: 100%;
        }

        .carousel-slide {
            min-width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            flex-shrink: 0;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(26, 5, 51, 0.5);
            backdrop-filter: blur(4px);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .member-card:hover .carousel-btn {
            opacity: 1;
        }

        .carousel-btn:hover {
            background: rgba(26, 5, 51, 0.8);
        }

        .carousel-btn.prev { left: 4px; }
        .carousel-btn.next { right: 4px; }

        /* ============================================================ */
        /* ONLINE DOT - TOP RIGHT                                     */
        /* ============================================================ */
        .online-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 5;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #28a745;
            border: 2.5px solid #FFFFFF;
            box-shadow: 0 0 12px rgba(40, 167, 69, 0.6);
            animation: pulse-online 1.8s infinite;
            pointer-events: none;
        }

        .online-dot.offline {
            background: #adb5bd;
            animation: none;
            box-shadow: none;
        }

        @keyframes pulse-online {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
        }

        /* ============================================================ */
        /* LOVE ICON - BOTTOM RIGHT                                   */
        /* ============================================================ */
        .love-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            z-index: 5;
            background: rgba(26, 5, 51, 0.4);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: #fff;
            pointer-events: auto;
        }

        .love-btn:hover {
            transform: scale(1.15);
            background: rgba(26, 5, 51, 0.6);
        }

        .love-btn.liked {
            color: #ff0000;
            background: rgba(255, 0, 0, 0.2);
        }

        .love-btn.liked:hover {
            background: rgba(255, 0, 0, 0.3);
        }

        /* ============================================================ */
        /* LIKE COUNT BADGE - BOTTOM LEFT                             */
        /* ============================================================ */
        .like-count-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 50px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: "Inter", sans-serif;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .like-count-badge .heart-icon {
            font-size: 12px;
        }

        /* ============================================================ */
        /* VERIFIED BADGE - NEXT TO NAME                              */
        /* ============================================================ */
        .verified-badge-name {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #1DA1F2;
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            font-weight: 700;
            border: 1.5px solid #fff;
            box-shadow: 0 1px 4px rgba(29, 161, 242, 0.3);
            flex-shrink: 0;
        }

        /* ============================================================ */
        /* CARD INFO - LABEL FORMAT                                   */
        /* ============================================================ */
        .member-card__info {
            padding: 10px 12px 12px;
        }

        .member-card__info .detail-line {
            font-size: 13px;
            color: #1a0533;
            font-family: "Inter", sans-serif;
            padding: 2px 0;
            line-height: 1.5;
        }

        .member-card__info .detail-line .label {
            font-weight: 600;
            color: rgba(26, 5, 51, 0.5);
        }

        .member-card__info .detail-line .value {
            font-weight: 500;
            color: #1a0533;
        }

        .member-card__name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        .member-card__name-row h3 {
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 16px;
            font-weight: 700;
            color: #1a0533;
        }

        /* ============================================================ */
        /* BUTTONS - BIGGER AND BETTER                                */
        /* ============================================================ */
        .member-card__actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(108, 60, 179, 0.08);
        }

        .member-card__actions button {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "Inter", sans-serif;
            letter-spacing: 0.3px;
        }

        .btn-view {
            background: rgba(108, 60, 179, 0.1);
            color: #1a0533;
            border: 1px solid rgba(108, 60, 179, 0.05);
        }

        .btn-view:hover {
            background: rgba(108, 60, 179, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 60, 179, 0.1);
        }

        .btn-view:active {
            transform: scale(0.97);
        }

        .btn-message {
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            color: #fff;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-message::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.08) 50%,
                transparent 70%
            );
            animation: btn-shine 4s infinite;
        }

        @keyframes btn-shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .btn-message:hover {
            background: linear-gradient(135deg, #4a1a6b, #6c3cb3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 60, 179, 0.3);
        }

        .btn-message:active {
            transform: scale(0.97);
        }

        .btn-message .icon {
            margin-right: 4px;
        }

        /* ============================================================ */
        /* EMPTY STATE                                                 */
        /* ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(26, 5, 51, 0.3);
            grid-column: 1 / -1;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 22px;
            color: #1a0533;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-family: "Inter", sans-serif;
        }

        /* ============================================================ */
        /* PAGINATION                                                  */
        /* ============================================================ */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            padding: 0 16px;
        }

        .pagination button {
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(108, 60, 179, 0.1);
            border-radius: 6px;
            color: rgba(26, 5, 51, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            font-size: 12px;
        }

        .pagination button:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        .pagination button.active {
            background: #6c3cb3;
            color: #fff;
            border-color: #6c3cb3;
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================ */
        /* SHARE TOAST                                                 */
        /* ============================================================ */
        .share-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(26, 5, 51, 0.95);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s ease;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .share-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .share-toast .close-share {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            padding: 0 0 0 10px;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .share-toast .close-share:hover {
            opacity: 1;
        }

        .share-toast .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: #25D366;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
            font-family: "Inter", sans-serif;
            transition: all 0.3s ease;
        }

        .share-toast .share-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
        }

        /* ============================================================ */
        /* TOAST                                                       */
        /* ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            background: #1a0533;
            color: #fff;
            border-radius: 10px;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            font-size: 13px;
            z-index: 999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 360px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            background: #28a745;
        }
        .toast.error {
            background: #dc3545;
        }

        /* ============================================================ */
        /* RESPONSIVE                                                  */
        /* ============================================================ */
        @media (max-width: 768px) {
            .activity-ticker {
                top: 60px;
                padding: 8px 0;
            }
            .ticker-item {
                font-size: 12px;
            }
            .ticker-item .time-badge {
                font-size: 10px;
                padding: 1px 10px;
            }
            .members-wrapper {
                padding: 110px 0 40px;
            }
            .members-header {
                padding: 0 10px;
                margin-bottom: 12px;
            }
            .members-header h1 {
                font-size: 22px;
            }
            .members-grid {
                gap: 3px;
            }
            .member-card__image-wrapper {
                max-height: 170px;
            }
            .member-card__info {
                padding: 8px 8px 10px;
            }

<body>

    <!-- ============================================================ -->
    <!-- HEADER - ClassyDate❤️ at corner edge                         -->

                <div class="menu-dropdown" id="menuDropdown">
                    <a href="#" onclick="logoutUser()" class="logout-btn">🚪 Log out</a>
                </div>

    <!-- ============================================================ -->

    <!-- ============================================================ -->

    <main class="members-wrapper">

    <!-- ============================================================ -->

    <!-- ============================================================ -->

    <!-- ============================================================ -->

    <!-- ============================================================ -->
    <!-- SCRIPTS                                                      -->
    <!-- ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
            }
        }
    </script>

    <script type="module">
        import { createClient } from "@supabase/supabase-js";

        const SUPABASE_URL = 'https://ehfnzsfnsoiyiwpxqmli.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ybgZxnGuU_Gt35rfqkEdBw_YkEdD8vl';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('🔥 Supabase connected!');

        let allMembers = [];
        let filteredMembers = [];
        let currentPage = 1;
        const perPage = 6;
        let currentView = 'grid';
        let isLoading = true;
        let selectedMemberId = null;

        const photoIndexMap = {};
        const carouselIntervals = {};

        const grid = document.getElementById('members-grid');
        const paginationContainer = document.getElementById('pagination');
        const totalCount = document.getElementById('total-count');

        // Track liked members
        const likedMembers = new Set();

        // Store like counts for each member
        const likeCounts = {};

        // ============================================================
        // TICKER DATA - RANDOM CONNECTIONS
        // ============================================================
        const firstNames = [
            'Mark', 'Judith', 'Sarah', 'James', 'Emma', 'David', 'Lisa', 'Michael',
            'Maria', 'John', 'Anna', 'Chris', 'Jessica', 'Daniel', 'Sophie', 'Peter',
            'Linda', 'Robert', 'Grace', 'William', 'Karen', 'Joseph', 'Nancy', 'Charles',
            'Betty', 'Thomas', 'Helen', 'Christopher', 'Sandra', 'Matthew', 'Donna', 'Anthony',
            'Carol', 'Donald', 'Ruth', 'Paul', 'Sharon', 'Mark', 'Cynthia', 'George',
            'Kathleen', 'Steven', 'Deborah', 'Kenneth', 'Stephanie', 'Edward', 'Laura', 'Brian'
        ];

        const countries = [
            'USA', 'UK', 'Canada', 'Australia', 'Germany', 'France', 'Italy', 'Spain',
            'Kenya', 'Nigeria', 'South Africa', 'Ghana', 'Uganda', 'Tanzania', 'Zimbabwe',
            'Brazil', 'Mexico', 'Japan', 'China', 'India', 'Sweden', 'Norway', 'Denmark',
            'Netherlands', 'Switzerland', 'New Zealand', 'Ireland', 'Portugal', 'Greece',
            'Egypt', 'Morocco', 'Turkey', 'UAE', 'Singapore', 'Malaysia', 'Philippines'
        ];

        const timeAgo = [
            '2 mins ago', '5 mins ago', '8 mins ago', '12 mins ago', '15 mins ago',
            '22 mins ago', '30 mins ago', '45 mins ago', '1 hour ago', '2 hours ago',
            '3 hours ago', '4 hours ago', '5 hours ago', '6 hours ago', '7 hours ago',
            '8 hours ago', '10 hours ago', '12 hours ago', '14 hours ago', '16 hours ago',
            '18 hours ago', '20 hours ago', '22 hours ago', '1 day ago', '2 days ago',
            '3 days ago', '4 days ago', '5 days ago', '6 days ago', '1 week ago',
            '2 weeks ago', '3 weeks ago', '1 month ago'
        ];

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateTickerItems(count = 12) {
            const items = [];
            const usedPairs = new Set();

            for (let i = 0; i < count; i++) {
                let name1, name2, pairKey;
                let attempts = 0;
                
                do {
                    name1 = getRandomElement(firstNames);
                    name2 = getRandomElement(firstNames);
                    pairKey = [name1, name2].sort().join('-');
                    attempts++;
                } while ((name1 === name2 || usedPairs.has(pairKey)) && attempts < 50);

                usedPairs.add(pairKey);

                const country1 = getRandomElement(countries);
                const country2 = getRandomElement(countries);
                const time = getRandomElement(timeAgo);
                const isOnline = Math.random() > 0.3;

                items.push({
                    name1,
                    name2,
                    country1,
                    country2,
                    time,
                    isOnline,
                    id: i
                });
            }

            return items;
        }

        let tickerItems = generateTickerItems(12);

        // ============================================================
        // RENDER TICKER
        // ============================================================
        function renderTicker() {
            const container = document.getElementById('tickerContent');
            
            // Create 2 sets for seamless looping
            const allItems = [...tickerItems, ...tickerItems];
            
            container.innerHTML = allItems.map(item => `
                <div class="ticker-item">
                    <span class="live-dot"></span>
                    <span class="sparkle">✨</span>
                    <span class="name-highlight">${item.name1}</span>
                    <span class="separator">(from ${item.country1})</span>
                    <span class="separator">and</span>
                    <span class="name-highlight2">${item.name2}</span>
                    <span class="separator">(from ${item.country2})</span>
                    <span class="separator">got connected</span>
                    <span class="time-badge">${item.time}</span>
                    <span class="heart-pulse">❤️</span>
                    <span class="fire-icon">🔥</span>
                </div>
            `).join('');
        }

        // Refresh ticker items every 30 seconds
        function refreshTicker() {
            tickerItems = generateTickerItems(12);
            renderTicker();
        }

        // ============================================================
        // GENERATE RANDOM LIKES
        // ============================================================
        function generateRandomLikes() {
            const random = Math.random();
            if (random < 0.1) {
                return Math.floor(Math.random() * 200) + 200;
            } else if (random < 0.3) {
                return Math.floor(Math.random() * 100) + 100;
            } else if (random < 0.6) {
                return Math.floor(Math.random() * 70) + 30;
            } else {
                return Math.floor(Math.random() * 26) + 4;
            }
        }

        function getPhotoUrl(fileId) {
            if (!fileId) return null;
            try {
                const { data } = supabase.storage.from('member_photos').getPublicUrl(fileId);
                return data?.publicUrl || null;
            } catch (error) {
                console.warn('Error getting photo URL for:', fileId, error);
                return null;
            }
        }

        window.toggleMenu = function() {
            const dropdown = document.getElementById('menuDropdown');
            dropdown.classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            const container = document.querySelector('.menu-container');
            if (container && !container.contains(e.target)) {
                document.getElementById('menuDropdown').classList.remove('show');
            }
        });

        window.logoutUser = function() {
            localStorage.removeItem('classy_user');
            localStorage.removeItem('classydate_user');
            localStorage.removeItem('classy_user_email');
            localStorage.removeItem('classy_user_name');
            localStorage.removeItem('classy_user_id');
            localStorage.removeItem('admin_logged_in');
            window.location.href = 'login.html';
        }

        // ============================================================
        // LOAD MEMBERS
        // ============================================================
        async function loadMembers() {
            try {
                const { data, error } = await supabase
                    .from('members')
                    .select('*')
                    .eq('verified', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allMembers = data || [];
                isLoading = false;
                console.log('📊 Admin members loaded:', allMembers.length);
                
                totalCount.textContent = allMembers.length;
                filteredMembers = [...allMembers];
                
                allMembers.forEach(member => {
                    likeCounts[member.id] = generateRandomLikes();
                });
                
                renderMembers(filteredMembers);
                updatePagination(filteredMembers.length);
                
            } catch (error) {
                console.error('Error loading members:', error);
                showToast('Error loading members: ' + error.message, 'error');
                isLoading = false;
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="icon">⚠️</div>
                        <h3>Could not load members</h3>
                        <p>Please check your connection.</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // CHANGE PHOTO
        // ============================================================
        window.changePhoto = function(memberId, direction) {
            const wrapper = document.querySelector(`.member-card__image-wrapper[data-member="${memberId}"]`);
            if (!wrapper) return;

            const slides = wrapper.querySelector('.carousel-slides');
            if (!slides) return;
            const totalSlides = slides.children.length;
            if (totalSlides <= 1) return;

            if (!photoIndexMap[memberId]) photoIndexMap[memberId] = 0;
            let current = photoIndexMap[memberId];

            let newIndex = current + direction;
            if (newIndex < 0) newIndex = totalSlides - 1;
            if (newIndex >= totalSlides) newIndex = 0;

            slides.style.transform = `translateX(-${newIndex * 100}%)`;
            photoIndexMap[memberId] = newIndex;
        }

        // ============================================================
        // START CAROUSEL
        // ============================================================
        function startCarousel(memberId) {
            if (carouselIntervals[memberId]) clearInterval(carouselIntervals[memberId]);
            
            const wrapper = document.querySelector(`.member-card__image-wrapper[data-member="${memberId}"]`);
            if (!wrapper) return;
            
            const slides = wrapper.querySelector('.carousel-slides');
            if (!slides || slides.children.length <= 1) return;

            const randomDelay = 3500 + Math.random() * 2000;
            
            carouselIntervals[memberId] = setInterval(() => {
                window.changePhoto(memberId, 1);
            }, randomDelay);
        }

        // ============================================================
        // HANDLE LIKE
        // ============================================================
        window.handleLike = function(memberId, event) {
            event.stopPropagation();
            
            const btn = document.querySelector(`.love-btn[data-member="${memberId}"]`);
            if (!btn) return;

            if (likedMembers.has(memberId)) {
                likedMembers.delete(memberId);
                btn.classList.remove('liked');
                btn.textContent = '🤍';
                if (likeCounts[memberId] > 0) {
                    likeCounts[memberId]--;
                }
                showToast('💔 Unliked', 'success');
            } else {
                likedMembers.add(memberId);
                btn.classList.add('liked');
                btn.textContent = '❤️';
                likeCounts[memberId] = (likeCounts[memberId] || 0) + 1;
                showToast('❤️ Liked!', 'success');
            }
            
            updateLikeCountDisplay(memberId);
        }

        function updateLikeCountDisplay(memberId) {
            const badge = document.querySelector(`.like-count-badge[data-member="${memberId}"]`);
            if (badge) {
                const count = likeCounts[memberId] || 0;
                badge.innerHTML = `<span class="heart-icon">❤️</span> ${count.toLocaleString()}`;
            }
        }

        // ============================================================
        // RENDER MEMBERS
        // ============================================================
        function renderMembers(members) {
            console.log('🎨 Rendering members:', members.length);
            
            if (isLoading) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(26,5,51,0.3);">
                        <span style="display:inline-block;width:30px;height:30px;border:3px solid rgba(108,60,179,0.1);border-top-color:#6c3cb3;border-radius:50%;animation:spin 0.8s linear infinite;"></span>
                        <br><br>Loading members...
                    </div>
                `;
                return;
            }

            if (members.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="icon">💎</div>
                        <h3>No members yet</h3>
                        <p>Check back soon for amazing people!</p>
                    </div>
                `;
                return;
            }

            totalCount.textContent = members.length;

            grid.innerHTML = members.map(member => {
                let photos = [];
                if (member.photo_file_ids && member.photo_file_ids.length > 0) {
                    photos = member.photo_file_ids
                        .map(id => getPhotoUrl(id))
                        .filter(url => url !== null && url !== '');
                }

                const memberName = member.name || 'User';
                const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(memberName)}&background=6c3cb3&color=fff&size=400`;
                
                if (photos.length === 0) {
                    photos = [avatarUrl];
                }

                let slidesHTML = '';
                photos.forEach((photo, index) => {
                    slidesHTML += `
                        <div class="carousel-slide">
                            <img src="${photo}" alt="${memberName}" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(memberName)}&background=6c3cb3&color=fff&size=400'">
                        </div>
                    `;
                });

                const isOnline = Math.random() > 0.5;
                const onlineDot = isOnline ? 
                    `<span class="online-dot"></span>` : 
                    `<span class="online-dot offline"></span>`;

                const verifiedBadgeName = member.verified ? 
                    `<span class="verified-badge-name">✓</span>` : '';

                const isLiked = likedMembers.has(member.id);
                const loveIcon = isLiked ? '❤️' : '🤍';
                const likedClass = isLiked ? 'liked' : '';

                const likeCount = likeCounts[member.id] || generateRandomLikes();
                likeCounts[member.id] = likeCount;

                const currentLocation = member.current_location || member.location || 'Location Unknown';
                const homeCountry = member.home_country || member.origin || 'Not specified';

                return `
                    <div class="member-card" data-id="${member.id}" data-name="${memberName}" data-location="${currentLocation}" data-origin="${homeCountry}" data-age="${member.age || ''}" data-verified="${member.verified}">
                        <div class="member-card__image-wrapper" data-member="${member.id}">
                            <div class="carousel-slides" style="display:flex;transition:transform 0.8s ease;">
                                ${slidesHTML}
                            </div>
                            ${onlineDot}
                            <button class="love-btn ${likedClass}" data-member="${member.id}" onclick="window.handleLike('${member.id}', event)">
                                ${loveIcon}
                            </button>
                            <div class="like-count-badge" data-member="${member.id}">
                                <span class="heart-icon">❤️</span> ${likeCount.toLocaleString()}
                            </div>
                            ${photos.length > 1 ? `
                                <button class="carousel-btn prev" onclick="event.stopPropagation(); window.changePhoto('${member.id}', -1)">‹</button>
                                <button class="carousel-btn next" onclick="event.stopPropagation(); window.changePhoto('${member.id}', 1)">›</button>
                            ` : ''}
                        </div>
                        <div class="member-card__info">
                            <div class="member-card__name-row">
                                <h3>${memberName}</h3>
                                ${verifiedBadgeName}
                            </div>
                            <div class="detail-line">
                                <span class="label">Age: </span>
                                <span class="value">${member.age || '—'}</span>
                            </div>
                            <div class="detail-line">
                                <span class="label">Current Location: </span>
                                <span class="value">${currentLocation}</span>
                            </div>
                            <div class="detail-line">
                                <span class="label">Origin Country: </span>
                                <span class="value">${homeCountry}</span>
                            </div>
                            <div class="member-card__actions">
                                <button class="btn-view" onclick="event.stopPropagation(); window.viewProfile('${member.id}')">👤 View</button>
                                <button class="btn-message" onclick="event.stopPropagation(); window.sendMessage('${member.id}')">💬 Message</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            members.forEach(member => {
                startCarousel(member.id);
            });

            document.querySelectorAll('.member-card').forEach(card => {
                card.removeEventListener('click', handleCardClick);
                card.addEventListener('click', handleCardClick);
            });

            updatePagination(members.length);
        }

        // ============================================================
        // HANDLE CARD CLICK
        // ============================================================
        function handleCardClick(e) {
            if (e.target.closest('.btn-view') || e.target.closest('.btn-message') || e.target.closest('.carousel-btn') || e.target.closest('.love-btn')) {
                return;
            }
            const card = e.currentTarget;
            const id = card.dataset.id;
            if (id) {
                window.viewProfile(id);
            }
        }

        // ============================================================
        // VIEW PROFILE
        // ============================================================
        window.viewProfile = function(id) {
            const member = allMembers.find(m => m.id === id);
            if (!member) {
                showToast('❌ Member not found', 'error');
                return;
            }
            localStorage.setItem('classydate_selected_member', JSON.stringify(member));
            window.location.href = `profile.html?id=${id}`;
        }

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        window.sendMessage = function(id) {
            const member = allMembers.find(m => m.id === id);
            if (!member) {
                showToast('❌ Member not found', 'error');
                return;
            }

            const user = localStorage.getItem('classy_user');
            if (!user) {
                showToast('🔒 Please log in to send messages', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                return;
            }

            localStorage.setItem('classydate_selected_member', JSON.stringify(member));
            
            const currentLocation = member.current_location || member.location || '';
            const homeCountry = member.home_country || member.origin || '';
            
            window.location.href = `chat.html?user=${id}&name=${encodeURIComponent(member.name)}&location=${encodeURIComponent(currentLocation)}&origin=${encodeURIComponent(homeCountry)}`;
        }

        // ============================================================
        // LONG PRESS TO SHARE
        // ============================================================
        let longPressTimer = null;
        let isLongPress = false;

        function setupLongPress(card) {
            card.addEventListener('touchstart', function(e) {
                isLongPress = false;
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    handleLongPress(this, e);
                }, 600);
            });

            card.addEventListener('touchmove', function(e) {
                clearTimeout(longPressTimer);
            });

            card.addEventListener('touchend', function(e) {
                clearTimeout(longPressTimer);
                if (isLongPress) {
                    e.preventDefault();
                }
            });

            card.addEventListener('mousedown', function(e) {
                isLongPress = false;
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    handleLongPress(this, e);
                }, 800);
            });

            card.addEventListener('mouseup', function(e) {
                clearTimeout(longPressTimer);
            });

            card.addEventListener('mouseleave', function(e) {
                clearTimeout(longPressTimer);
            });
        }

        function handleLongPress(card, event) {
            event.preventDefault();
            
            const id = card.dataset.id;
            const name = card.dataset.name || 'Member';
            const location = card.dataset.location || 'Unknown';
            const origin = card.dataset.origin || 'Not specified';
            const age = card.dataset.age || '?';
            const verified = card.dataset.verified === 'true';

            const member = allMembers.find(m => m.id === id);
            if (!member) return;

            const shareToast = document.getElementById('share-toast');
            shareToast.classList.add('show');

            const shareBtn = document.getElementById('share-whatsapp-btn');
            shareBtn.onclick = function() {
                shareOnWhatsApp(member);
            };

            card.classList.add('long-press');
            setTimeout(() => {
                card.classList.remove('long-press');
            }, 300);
        }

        window.closeShareToast = function() {
            document.getElementById('share-toast').classList.remove('show');
        }

        function shareOnWhatsApp(member) {
            const name = member.name || 'Member';
            const currentLocation = member.current_location || member.location || 'Unknown';
            const homeCountry = member.home_country || member.origin || 'Not specified';
            const age = member.age || '?';
            const verified = member.verified ? '✅ Verified Member' : '';
            const likeCount = likeCounts[member.id] || 0;

            const message = `
👤 *${name}* ${verified ? '✔️' : ''}
📍 Location: ${currentLocation}
🌍 Home Country: ${homeCountry}
🎂 Age: ${age}
❤️ ${likeCount.toLocaleString()} likes
💎 ClassyDate Member

---
Check out this member on ClassyDate!
https://classydate.com/profile/${member.id}
            `.trim();

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/?text=${encodedMessage}`;

            document.getElementById('share-toast').classList.remove('show');
            window.open(whatsappUrl, '_blank');
            showToast('📤 Opening WhatsApp...', 'success');
        }

        // ============================================================
        // VIEW FUNCTIONS
        // ============================================================
        window.setView = function(view) {
            currentView = view;
            grid.className = 'members-grid' + (view === 'list' ? ' list-view' : '');
            document.getElementById('grid-view').classList.toggle('active', view === 'grid');
            document.getElementById('list-view').classList.toggle('active', view === 'list');
            renderMembers(filteredMembers);
        }

        function updatePagination(total) {
            const pages = Math.ceil(total / perPage);
            if (pages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let html = `<button onclick="window.goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ Prev</button>`;
            for (let i = 1; i <= Math.min(pages, 5); i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="window.goToPage(${i})">${i}</button>`;
            }
            if (pages > 5) {
                html += `<span style="color:rgba(26,5,51,0.15);padding:8px;">…</span>`;
                html += `<button onclick="window.goToPage(${pages})">${pages}</button>`;
            }
            html += `<button onclick="window.goToPage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}>Next ›</button>`;

            paginationContainer.innerHTML = html;
        }

        window.goToPage = function(page) {
            const total = filteredMembers.length;
            const pages = Math.ceil(total / perPage);
            if (page < 1 || page > pages) return;
            currentPage = page;
            renderMembers(filteredMembers);
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // INIT
        // ============================================================
        renderTicker();
        
        // Refresh ticker every 30 seconds
        setInterval(refreshTicker, 30000);

        loadMembers();

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.member-card').forEach(card => {
                setupLongPress(card);
            });
        });

        console.log('💎 ClassyDate Members Page - SUPER HOT!');
        console.log('✅ Live activity ticker with random connections');
        console.log('✅ Mark (Sweden) and Judith (Uganda) got connected');
        console.log('✅ Random times: 2 mins ago, 4 hours ago, 1 week ago');
        console.log('✅ Bigger View & Message buttons');
        console.log('✅ Random like counts (4-400)');
        console.log('✅ Ticker updates every 30 seconds');
        console.log('✅ Pauses on hover');
    </script>

</body>
</html>
