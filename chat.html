<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>ClassyDate Support</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f3e8ff;
            color: #1a0533;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }

        a { text-decoration: none; color: inherit; }

        /* ============================================================ */
        /* HEADER                                                      */
        /* ============================================================ */
        .cb-shell-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(108, 60, 179, 0.12);
        }

        .cb-shell-header__inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cb-shell-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .cb-shell-button {
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: "Inter", sans-serif;
        }

        .cb-shell-button--back {
            background: rgba(108, 60, 179, 0.08);
            color: #1a0533;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cb-shell-button--back:hover {
            background: rgba(108, 60, 179, 0.15);
        }

        .cb-shell-brand {
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 20px;
            font-weight: 700;
            color: #1a0533;
            margin: 0 auto;
        }

        .cb-shell-brand .heart {
            color: #ff0000;
            display: inline-block;
        }

        .cb-shell-brand span {
            font-family: "Inter", sans-serif;
            font-weight: 300;
            color: #6c3cb3;
        }

        .admin-badge {
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            color: #fff;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            font-family: "Inter", sans-serif;
        }

        /* ============================================================ */
        /* CHAT WRAPPER                                                */
        /* ============================================================ */
        .chat-wrapper {
            display: flex;
            flex-direction: column;
            padding: 72px 16px 12px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        /* ============================================================ */
        /* SUPPORT HEADER                                               */
        /* ============================================================ */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            border: 1px solid rgba(108, 60, 179, 0.08);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        .chat-header__avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6c3cb3;
            flex-shrink: 0;
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
        }

        .chat-header__info {
            flex: 1;
            min-width: 0;
        }

        .chat-header__info h2 {
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 17px;
            font-weight: 700;
            color: #1a0533;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chat-header__info .subtext {
            font-size: 12px;
            color: rgba(26, 5, 51, 0.5);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chat-header__status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot--online {
            background: #28a745;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
            animation: pulse-dot 2s infinite;
        }

        .status-dot--offline {
            background: #adb5bd;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.15); }
        }

        .status-text--online { color: #28a745; }
        .status-text--offline { color: rgba(26, 5, 51, 0.4); }

        /* ============================================================ */
        /* USER DETAILS PANEL (ADMIN SIDE ONLY)                        */
        /* ============================================================ */
        .user-details-panel {
            display: none;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(108, 60, 179, 0.1);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .user-details-panel.show { display: block; }

        .user-details-panel .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(108, 60, 179, 0.08);
        }

        .user-details-panel .user-name {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 16px;
            font-weight: 700;
            color: #1a0533;
        }

        .user-details-panel .badge-open {
            background: rgba(40, 167, 69, 0.12);
            color: #28a745;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
        }

        .user-details-panel .badge-pending {
            background: rgba(255, 165, 0, 0.12);
            color: #b37400;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
        }

        .user-details-panel .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 6px 14px;
            margin-bottom: 8px;
        }

        .user-details-panel .info-item {
            font-size: 12px;
            color: rgba(74, 26, 107, 0.75);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-details-panel .info-item .label {
            font-weight: 600;
            color: rgba(74, 26, 107, 0.55);
        }

        .user-details-panel .photos-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .user-details-panel .photos-row img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(108, 60, 179, 0.15);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .user-details-panel .photos-row img:hover {
            transform: scale(1.08);
        }

        /* ============================================================ */
        /* MESSAGES CONTAINER                                          */
        /* ============================================================ */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            border: 1px solid rgba(108, 60, 179, 0.06);
            backdrop-filter: blur(5px);
            margin-bottom: 8px;
            min-height: 0;
        }

        .messages-container::-webkit-scrollbar { width: 5px; }
        .messages-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(108, 60, 179, 0.2);
            border-radius: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .message--received { align-items: flex-start; }
        .message--sent { align-items: flex-end; }

        .message__bubble {
            max-width: 78%;
            padding: 9px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .message--received .message__bubble {
            background: rgba(255, 255, 255, 0.7);
            color: #1a0533;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(108, 60, 179, 0.08);
        }

        .message--sent .message__bubble {
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message__bubble img {
            max-width: 100%;
            max-height: 260px;
            border-radius: 8px;
            display: block;
            cursor: pointer;
        }

        .message__time {
            font-size: 10px;
            color: rgba(26, 5, 51, 0.35);
            margin-top: 3px;
            padding: 0 4px;
        }

        .message__sender {
            font-size: 11px;
            font-weight: 700;
            color: rgba(26, 5, 51, 0.4);
            margin-bottom: 3px;
            padding: 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ============================================================ */
        /* DATE SEPARATOR                                              */
        /* ============================================================ */
        .date-separator {
            text-align: center;
            margin: 14px 0;
            position: relative;
        }

        .date-separator span {
            font-size: 11px;
            color: rgba(26, 5, 51, 0.4);
            background: rgba(255, 255, 255, 0.5);
            padding: 3px 12px;
            border-radius: 50px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(108, 60, 179, 0.08);
        }

        /* ============================================================ */
        /* INPUT                                                       */
        /* ============================================================ */
        .message-input-container {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            border: 1px solid rgba(108, 60, 179, 0.08);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
            align-items: center;
        }

        .message-input-container input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(108, 60, 179, 0.1);
            border-radius: 10px;
            color: #1a0533;
            font-size: 14px;
            outline: none;
            font-family: "Inter", sans-serif;
            transition: all 0.3s ease;
            min-height: 40px;
        }

        .message-input-container input[type="text"]::placeholder {
            color: rgba(26, 5, 51, 0.3);
        }

        .message-input-container input[type="text"]:focus {
            border-color: #6c3cb3;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 3px rgba(108, 60, 179, 0.08);
        }

        .icon-btn {
            padding: 8px 10px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            color: #1a0533;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            font-family: "Inter", sans-serif;
            min-height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        .icon-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-send {
            padding: 10px 22px;
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            min-height: 40px;
            border: none;
            transition: all 0.3s ease;
            font-family: "Inter", sans-serif;
        }

        .btn-send:hover {
            background: linear-gradient(135deg, #4a1a6b, #6c3cb3);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(108, 60, 179, 0.25);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================================ */
        /* EMPTY STATE                                                 */
        /* ============================================================ */
        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(26, 5, 51, 0.3);
            text-align: center;
            padding: 20px;
        }

        .empty-chat .icon {
            font-size: 52px;
            margin-bottom: 12px;
        }

        .empty-chat h3 {
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 20px;
            color: #1a0533;
            margin-bottom: 6px;
        }

        .empty-chat p {
            font-size: 14px;
            font-family: "Inter", sans-serif;
            max-width: 320px;
        }

        /* ============================================================ */
        /* LOADING                                                     */
        /* ============================================================ */
        .loading-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
            color: rgba(26, 5, 51, 0.4);
            font-size: 13px;
        }

        .loading-spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(108, 60, 179, 0.1);
            border-top-color: #6c3cb3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================================ */
        /* TOAST                                                       */
        /* ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            background: #1a0533;
            color: #fff;
            border-radius: 10px;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            font-size: 13px;
            z-index: 999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 360px;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
        .toast.info { background: #6c3cb3; }

        /* ============================================================ */
        /* LIGHTBOX                                                    */
        /* ============================================================ */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: zoom-out;
        }

        .lightbox.show { display: flex; }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* ============================================================ */
        /* RESPONSIVE                                                  */
        /* ============================================================ */
        @media (max-width: 768px) {
            .chat-wrapper { padding: 68px 12px 10px; }
            .chat-header { padding: 10px 12px; gap: 10px; }
            .chat-header__avatar { width: 40px; height: 40px; font-size: 18px; }
            .chat-header__info h2 { font-size: 15px; }
            .chat-header__info .subtext { font-size: 11px; }
            .message__bubble { font-size: 13px; padding: 8px 12px; max-width: 85%; }
            .message-input-container { padding: 6px 10px; gap: 6px; }
            .message-input-container input[type="text"] { font-size: 13px; padding: 8px 12px; min-height: 36px; }
            .btn-send { padding: 8px 16px; font-size: 12px; min-height: 36px; }
            .icon-btn { padding: 6px 8px; font-size: 16px; min-height: 36px; min-width: 36px; }
            .cb-shell-brand { font-size: 17px; }
            .cb-shell-button { padding: 4px 12px; font-size: 12px; }
            .admin-badge { font-size: 10px; padding: 4px 10px; }
            .toast { bottom: 20px; right: 20px; left: 20px; text-align: center; }
            .user-details-panel .info-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .chat-wrapper { padding: 62px 8px 8px; }
            .chat-header { padding: 8px 10px; gap: 8px; }
            .chat-header__avatar { width: 36px; height: 36px; font-size: 16px; }
            .chat-header__info h2 { font-size: 13px; }
            .chat-header__info .subtext { font-size: 10px; }
            .message__bubble { font-size: 12px; padding: 7px 11px; max-width: 88%; }
            .message__bubble img { max-height: 200px; }
            .message-input-container input[type="text"] { font-size: 12px; padding: 6px 10px; min-height: 34px; }
            .btn-send { padding: 6px 12px; font-size: 11px; min-height: 34px; }
            .icon-btn { padding: 6px 8px; font-size: 15px; min-height: 34px; min-width: 34px; }
            .cb-shell-header__inner { height: 54px; padding: 0 10px; }
            .cb-shell-brand { font-size: 15px; }
            .user-details-panel .photos-row img { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="cb-shell-header" role="banner">
        <div class="cb-shell-header__inner">
            <button class="cb-shell-button cb-shell-button--back" onclick="goBack()">← Back</button>
            <a class="cb-shell-brand" href="index.html">
                Classy<span>Date</span><span class="heart">❤️</span>
            </a>
            <span class="admin-badge" id="role-badge" style="display:none;">🔑 ADMIN</span>
        </div>
    </header>

    <!-- CHAT -->
    <main class="chat-wrapper">
        <!-- SUPPORT HEADER -->
        <div class="chat-header">
            <div class="chat-header__avatar" id="support-avatar">💬</div>
            <div class="chat-header__info">
                <h2 id="chat-name">ClassyDate Support Team</h2>
                <div class="subtext" id="chat-subtext">
                    <span>📧 support@classydate.com</span>
                    <span>•</span>
                    <span>Replies within minutes</span>
                </div>
            </div>
            <div class="chat-header__status">
                <span class="status-dot status-dot--offline" id="admin-status-dot"></span>
                <span class="status-text--offline" id="admin-status-text">Offline</span>
            </div>
        </div>

        <!-- USER DETAILS PANEL (ADMIN ONLY) -->
        <div class="user-details-panel" id="user-details-panel">
            <div class="top-row">
                <div class="user-name" id="ud-name">Loading...</div>
                <span class="badge-open" id="ud-status">🟢 Open</span>
            </div>
            <div class="info-grid">
                <div class="info-item"><span class="label">📧 Email:</span> <span id="ud-email">—</span></div>
                <div class="info-item"><span class="label">📱 WhatsApp:</span> <span id="ud-whatsapp">—</span></div>
                <div class="info-item"><span class="label">💎 Wants:</span> <span id="ud-member">—</span></div>
                <div class="info-item"><span class="label">🎂 Age:</span> <span id="ud-age">—</span></div>
                <div class="info-item"><span class="label">👤 Gender:</span> <span id="ud-gender">—</span></div>
                <div class="info-item"><span class="label">📍 Location:</span> <span id="ud-location">—</span></div>
                <div class="info-item"><span class="label">💼 Occupation:</span> <span id="ud-occupation">—</span></div>
            </div>
            <div class="photos-row" id="ud-photos"></div>
        </div>

        <!-- MESSAGES -->
        <div class="messages-container" id="messages-container">
            <div class="loading-wrap">
                <span class="loading-spinner"></span>
                Loading conversation...
            </div>
        </div>

        <!-- INPUT -->
        <div class="message-input-container">
            <button class="icon-btn" id="photo-btn" title="Send photo">📎</button>
            <input type="file" id="photo-input" accept="image/*" style="display:none;">
            <input type="text" id="message-input" placeholder="Type your message...">
            <button class="btn-send" id="send-btn">📤 Send</button>
        </div>
    </main>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Attachment">
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- SCRIPTS                                                      -->
    <!-- ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
            }
        }
    </script>

    <script type="module">
        import { createClient } from "@supabase/supabase-js";

        const SUPABASE_URL = 'https://eswlfgrzdmdwmfqncpew.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oeCfBt8Ci0xQ4mg6o2mnnA_mbgnwRVS';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('🔗 Supabase connected:', SUPABASE_URL);

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let isAdmin = false;
        let conversationId = null;
        let conversation = null;
        let messages = [];
        let realtimeChannel = null;
        let adminStatusInterval = null;

        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const photoBtn = document.getElementById('photo-btn');
        const photoInput = document.getElementById('photo-input');
        const toast = document.getElementById('toast');
        const roleBadge = document.getElementById('role-badge');
        const userDetailsPanel = document.getElementById('user-details-panel');
        const adminStatusDot = document.getElementById('admin-status-dot');
        const adminStatusText = document.getElementById('admin-status-text');

        // ============================================================
        // URL PARAMS
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        conversationId = urlParams.get('conversation');

        // ============================================================
        // AUTH + ROLE DETECTION
        // ============================================================
        async function detectRole() {
            try {
                const { data: { session } } = await supabase.auth.getSession();

                if (!session) {
                    // No session — user isn't logged in. We'll allow them to see the conversation,
                    // but only if it was created via their own submission flow.
                    // For now, we redirect to members.
                    console.warn('No auth session — user must be logged in');
                    // Allow viewing but disable sending
                    isAdmin = false;
                    currentUser = null;
                    return;
                }

                currentUser = session.user;

                // Check if admin
                const { data: adminRow } = await supabase
                    .from('admins')
                    .select('id, email')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (adminRow) {
                    isAdmin = true;
                    roleBadge.style.display = 'inline-block';
                    userDetailsPanel.classList.add('show');
                    console.log('🔑 Logged in as ADMIN');
                } else {
                    isAdmin = false;
                    console.log('👤 Logged in as USER');
                }
            } catch (err) {
                console.warn('Role detection failed:', err);
            }
        }

        // ============================================================
        // LOAD CONVERSATION
        // ============================================================
        async function loadConversation() {
            if (!conversationId) {
                showToast('No conversation specified', 'error');
                setTimeout(() => { window.location.href = 'members.html'; }, 1500);
                return null;
            }

            const { data, error } = await supabase
                .from('conversations')
                .select('*')
                .eq('id', conversationId)
                .maybeSingle();

            if (error) {
                console.error('Load conversation error:', error);
                showToast('Error loading conversation: ' + error.message, 'error');
                return null;
            }

            if (!data) {
                showToast('Conversation not found', 'error');
                setTimeout(() => { window.location.href = 'members.html'; }, 1500);
                return null;
            }

            conversation = data;
            return data;
        }

        // ============================================================
        // RENDER CONVERSATION HEADER
        // ============================================================
        function renderConversationHeader() {
            if (!conversation) return;

            if (isAdmin) {
                // ADMIN VIEW: show user details
                document.getElementById('chat-name').textContent = `Chat with ${conversation.full_name || 'User'}`;
                document.getElementById('chat-subtext').innerHTML = `
                    <span>📧 ${conversation.email || 'No email'}</span>
                    <span>•</span>
                    <span>📱 ${conversation.whatsapp_no || 'No WhatsApp'}</span>
                `;
                document.getElementById('support-avatar').textContent = '👤';

                // Fill user details panel
                document.getElementById('ud-name').textContent = '👤 ' + (conversation.full_name || 'Unknown');
                document.getElementById('ud-email').textContent = conversation.email || '—';
                document.getElementById('ud-whatsapp').textContent = conversation.whatsapp_no || '—';
                document.getElementById('ud-member').textContent = conversation.member_name || '—';
                document.getElementById('ud-age').textContent = conversation.age || '—';
                document.getElementById('ud-gender').textContent = conversation.gender || '—';
                document.getElementById('ud-location').textContent = conversation.location || '—';
                document.getElementById('ud-occupation').textContent = conversation.occupation || '—';

                const statusEl = document.getElementById('ud-status');
                if (conversation.status === 'open') {
                    statusEl.className = 'badge-open';
                    statusEl.textContent = '🟢 Open';
                } else {
                    statusEl.className = 'badge-pending';
                    statusEl.textContent = '🟡 ' + (conversation.status || 'Pending');
                }

                // Photos
                const photosRow = document.getElementById('ud-photos');
                if (conversation.user_photo_ids && conversation.user_photo_ids.length > 0) {
                    photosRow.innerHTML = conversation.user_photo_ids.map(id => {
                        const { data } = supabase.storage.from('user_uploads').getPublicUrl(id);
                        return data && data.publicUrl
                            ? `<img src="${data.publicUrl}" onclick="openLightbox('${data.publicUrl}')" alt="User photo">`
                            : '';
                    }).join('');
                } else {
                    photosRow.innerHTML = '';
                }

                // Admin status indicator shows "you" as online
                adminStatusDot.className = 'status-dot status-dot--online';
                adminStatusText.className = 'status-text--online';
                adminStatusText.textContent = 'You are Online';

            } else {
                // USER VIEW: just show support team
                document.getElementById('chat-name').textContent = 'ClassyDate Support Team';
                document.getElementById('chat-subtext').innerHTML = `
                    <span>📧 support@classydate.com</span>
                    <span>•</span>
                    <span>Replies within minutes</span>
                `;
                document.getElementById('support-avatar').textContent = '💬';

                // Online status reflects whether the admin is actually active
                checkAdminOnlineStatus();
            }
        }

        // ============================================================
        // CHECK ADMIN ONLINE STATUS
        // ============================================================
        async function checkAdminOnlineStatus() {
            if (isAdmin) return; // admin doesn't need to check themselves

            try {
                const { data, error } = await supabase
                    .from('admin_status')
                    .select('last_seen')
                    .order('last_seen', { ascending: false })
                    .limit(1)
                    .maybeSingle();

                if (error || !data) {
                    setAdminOffline();
                    return;
                }

                const lastSeen = new Date(data.last_seen).getTime();
                const now = Date.now();
                const diffSeconds = (now - lastSeen) / 1000;

                // Online if last_seen within 60 seconds
                if (diffSeconds <= 60) {
                    setAdminOnline();
                } else {
                    setAdminOffline();
                }
            } catch (err) {
                setAdminOffline();
            }
        }

        function setAdminOnline() {
            adminStatusDot.className = 'status-dot status-dot--online';
            adminStatusText.className = 'status-text--online';
            adminStatusText.textContent = 'Online';
        }

        function setAdminOffline() {
            adminStatusDot.className = 'status-dot status-dot--offline';
            adminStatusText.className = 'status-text--offline';
            adminStatusText.textContent = 'Offline';
        }

        // ============================================================
        // LOAD MESSAGES
        // ============================================================
        async function loadMessages() {
            if (!conversationId) return;

            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .eq('conversation_id', conversationId)
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Load messages error:', error);
                showToast('Error loading messages', 'error');
                return;
            }

            messages = data || [];
            renderMessages();
        }

        // ============================================================
        // RENDER MESSAGES
        // ============================================================
        function renderMessages() {
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-chat">
                        <div class="icon">💬</div>
                        <h3>No messages yet</h3>
                        <p>${isAdmin ? 'Send a message to start the conversation.' : 'Type your first message below — our team will respond shortly.'}</p>
                    </div>
                `;
                return;
            }

            let lastDate = '';
            let html = '';

            messages.forEach(msg => {
                const msgDate = new Date(msg.created_at);
                const dateStr = msgDate.toDateString();

                // Insert date separator if day changed
                if (dateStr !== lastDate) {
                    lastDate = dateStr;
                    html += `<div class="date-separator"><span>${formatDateLabel(msgDate)}</span></div>`;
                }

                // Determine side based on perspective
                // From user's perspective: user's own messages = sent (right), admin = received (left)
                // From admin's perspective: admin's own messages = sent (right), user = received (left)
                let isSent;
                if (isAdmin) {
                    isSent = msg.sender_type === 'admin';
                } else {
                    isSent = msg.sender_type === 'user';
                }

                const senderLabel = msg.sender_type === 'admin' ? 'ClassyDate Support' : (conversation.full_name || 'User');
                const timeStr = msgDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let contentHTML = '';
                if (msg.attachment_url) {
                    contentHTML += `<img src="${msg.attachment_url}" onclick="openLightbox('${msg.attachment_url}')" alt="Attachment">`;
                }
                if (msg.text) {
                    contentHTML += `<div>${escapeHtml(msg.text)}</div>`;
                }

                html += `
                    <div class="message message--${isSent ? 'sent' : 'received'}">
                        ${!isSent ? `<div class="message__sender">${escapeHtml(senderLabel)}</div>` : ''}
                        <div class="message__bubble">${contentHTML}</div>
                        <div class="message__time">${timeStr}</div>
                    </div>
                `;
            });

            messagesContainer.innerHTML = html;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function formatDateLabel(date) {
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) return 'Today';
            if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) {
                showToast('Please type a message first!', 'error');
                return;
            }

            if (!conversation) {
                showToast('Conversation not loaded', 'error');
                return;
            }

            // Determine sender type
            const senderType = isAdmin ? 'admin' : 'user';
            const senderId = currentUser ? currentUser.id : null;

            if (!senderId) {
                showToast('🔒 Please log in to send messages', 'error');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = '⏳';

            try {
                const { error } = await supabase
                    .from('messages')
                    .insert([{
                        conversation_id: conversationId,
                        sender_type: senderType,
                        sender_id: senderId,
                        text: text
                    }]);

                if (error) throw error;

                // Update conversation's updated_at
                await supabase
                    .from('conversations')
                    .update({ updated_at: new Date().toISOString() })
                    .eq('id', conversationId);

                messageInput.value = '';
                // Reload messages (or rely on realtime)
                await loadMessages();
            } catch (err) {
                console.error('Send error:', err);
                showToast('Failed to send: ' + err.message, 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '📤 Send';
                messageInput.focus();
            }
        }

        // ============================================================
        // SEND PHOTO
        // ============================================================
        async function sendPhoto(file) {
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                showToast('Photo too large (max 5MB)', 'error');
                return;
            }
            if (!file.type.startsWith('image/')) {
                showToast('Only images allowed', 'error');
                return;
            }
            if (!currentUser) {
                showToast('🔒 Please log in to send photos', 'error');
                return;
            }

            photoBtn.disabled = true;
            photoBtn.textContent = '⏳';

            try {
                const ext = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 10)}.${ext}`;

                const { data, error } = await supabase.storage
                    .from('chat_attachments')
                    .upload(fileName, file);

                if (error) throw error;

                const { data: urlData } = supabase.storage
                    .from('chat_attachments')
                    .getPublicUrl(data.path);

                const attachmentUrl = urlData.publicUrl;

                const senderType = isAdmin ? 'admin' : 'user';
                const { error: insertErr } = await supabase
                    .from('messages')
                    .insert([{
                        conversation_id: conversationId,
                        sender_type: senderType,
                        sender_id: currentUser.id,
                        text: '',
                        attachment_url: attachmentUrl
                    }]);

                if (insertErr) throw insertErr;

                await supabase
                    .from('conversations')
                    .update({ updated_at: new Date().toISOString() })
                    .eq('id', conversationId);

                showToast('✅ Photo sent!', 'success');
                await loadMessages();
            } catch (err) {
                console.error('Photo send error:', err);
                showToast('Failed to send photo: ' + err.message, 'error');
            } finally {
                photoBtn.disabled = false;
                photoBtn.textContent = '📎';
                photoInput.value = '';
            }
        }

        // ============================================================
        // REALTIME SUBSCRIPTION
        // ============================================================
        function subscribeToMessages() {
            if (realtimeChannel) {
                supabase.removeChannel(realtimeChannel);
            }

            realtimeChannel = supabase
                .channel('messages:' + conversationId)
                .on(
                    'postgres_changes',
                    {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'messages',
                        filter: `conversation_id=eq.${conversationId}`
                    },
                    (payload) => {
                        console.log('📩 New message:', payload.new);
                        loadMessages();
                    }
                )
                .subscribe((status) => {
                    console.log('Realtime status:', status);
                });
        }

        // ============================================================
        // ADMIN STATUS POLLING (user side only)
        // ============================================================
        function startAdminStatusPolling() {
            if (isAdmin) return;
            if (adminStatusInterval) clearInterval(adminStatusInterval);
            adminStatusInterval = setInterval(checkAdminOnlineStatus, 15000);
        }

        // ============================================================
        // LIGHTBOX
        // ============================================================
        window.openLightbox = function(url) {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = url;
            lb.classList.add('show');
        }

        window.closeLightbox = function() {
            document.getElementById('lightbox').classList.remove('show');
        }

        // ============================================================
        // BACK
        // ============================================================
        window.goBack = function() {
            if (isAdmin) {
                window.location.href = 'adminpanel.html';
            } else {
                window.location.href = 'members.html';
            }
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout;
        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            photoBtn.addEventListener('click', () => photoInput.click());
            photoInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    sendPhoto(e.target.files[0]);
                }
            });
        });

        // ============================================================
        // INIT
        // ============================================================
        (async function init() {
            await detectRole();

            const conv = await loadConversation();
            if (!conv) return;

            renderConversationHeader();
            await loadMessages();
            subscribeToMessages();
            startAdminStatusPolling();

            // Focus input
            messageInput.focus();

            console.log('💬 Chat ready');
            console.log('Role:', isAdmin ? 'ADMIN' : 'USER');
            console.log('Conversation:', conversationId);
        })();
    </script>

</body>
</html>
