<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>Log In | ClassyDate</title>
    <meta name="description" content="Log in to your ClassyDate account and continue your journey.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f3e8ff;
            color: #1a0533;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }

        .cb-shell-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(108, 60, 179, 0.12);
        }

        .cb-shell-header__inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cb-shell-brand {
            display: flex;
            align-items: center;
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 22px;
            font-weight: 700;
            color: #1a0533;
            margin-left: -4px;
        }
        .cb-shell-brand .heart { color: #ff0000; display: inline-block; }
        .cb-shell-brand span {
            font-family: "Inter", sans-serif;
            font-weight: 300;
            color: #6c3cb3;
        }

        .cb-shell-actions { display: flex; align-items: center; gap: 8px; }

        .cb-shell-button {
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: "Inter", sans-serif;
        }
        .cb-shell-button--secondary {
            background: rgba(108, 60, 179, 0.1);
            color: #1a0533;
            border: 1px solid rgba(108, 60, 179, 0.12);
        }
        .cb-shell-button--secondary:hover { background: rgba(108, 60, 179, 0.18); }
        .cb-shell-button--primary {
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            color: #fff;
        }
        .cb-shell-button--primary:hover {
            background: linear-gradient(135deg, #4a1a6b, #6c3cb3);
            transform: translateY(-2px);
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 60px;
            min-height: 100vh;
            position: relative;
            background: radial-gradient(ellipse at center top, rgba(108, 60, 179, 0.06), transparent 70%);
        }

        .floating-hearts-login {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .heart-login {
            position: absolute;
            animation: floatUpLogin 14s infinite linear;
            opacity: 0;
        }
        @keyframes floatUpLogin {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.4; transform: translateY(90vh) rotate(10deg) scale(1); }
            90% { opacity: 0.4; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        .login-card {
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 60px rgba(108, 60, 179, 0.12);
        }

        .login-card__header { text-align: center; margin-bottom: 32px; }
        .login-card__header .icon { font-size: 48px; display: block; margin-bottom: 8px; }
        .login-card__header h1 {
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 30px;
            color: #1a0533;
            font-weight: 700;
        }
        .login-card__header p { color: rgba(26, 5, 51, 0.55); font-size: 14px; margin-top: 4px; }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(26, 5, 51, 0.7);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(108, 60, 179, 0.15);
            border-radius: 12px;
            color: #1a0533;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            font-family: "Inter", sans-serif;
        }
        .form-group input::placeholder { color: rgba(26, 5, 51, 0.3); }
        .form-group input:focus {
            border-color: #6c3cb3;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 4px rgba(108, 60, 179, 0.1);
        }

        .form-options {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 22px;
        }
        .form-options a {
            color: rgba(26, 5, 51, 0.5);
            font-size: 13px;
            transition: color 0.3s ease;
            font-weight: 500;
        }
        .form-options a:hover { color: #6c3cb3; }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "Inter", sans-serif;
            letter-spacing: 0.3px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 60, 179, 0.35);
            background: linear-gradient(135deg, #4a1a6b, #6c3cb3);
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-message,
        .success-message {
            display: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .error-message {
            background: rgba(220, 53, 69, 0.08);
            border: 1px solid rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }
        .success-message {
            background: rgba(40, 167, 69, 0.08);
            border: 1px solid rgba(40, 167, 69, 0.2);
            color: #28a745;
        }
        .error-message.show, .success-message.show { display: block; }
        .error-message.show { animation: shake 0.5s ease; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .login-footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(108, 60, 179, 0.08);
        }
        .login-footer p { color: rgba(26, 5, 51, 0.5); font-size: 14px; }
        .login-footer a { color: #6c3cb3; font-weight: 700; transition: color 0.3s ease; }
        .login-footer a:hover { color: #4a1a6b; text-decoration: underline; }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px 28px; border-radius: 20px; }
            .login-card__header h1 { font-size: 24px; }
            .cb-shell-header__inner { height: 58px; padding: 0 14px; }
            .cb-shell-brand { font-size: 18px; }
            .cb-shell-button { padding: 6px 16px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <header class="cb-shell-header" role="banner">
        <div class="cb-shell-header__inner">
            <a class="cb-shell-brand" href="index.html">
                Classy<span>Date</span><span class="heart">❤️</span>
            </a>
            <div class="cb-shell-actions">
                <a href="signup.html" class="cb-shell-button cb-shell-button--secondary">Join</a>
                <a href="login.html" class="cb-shell-button cb-shell-button--primary">Log in</a>
            </div>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="floating-hearts-login">
            <span class="heart-login" style="left:5%;animation-delay:0s;font-size:18px;">❤️</span>
            <span class="heart-login" style="left:15%;animation-delay:2s;font-size:24px;">💕</span>
            <span class="heart-login" style="left:25%;animation-delay:4s;font-size:14px;">❤️‍🔥</span>
            <span class="heart-login" style="left:35%;animation-delay:1s;font-size:28px;">💗</span>
            <span class="heart-login" style="left:45%;animation-delay:3s;font-size:18px;">❤️</span>
            <span class="heart-login" style="left:55%;animation-delay:5s;font-size:16px;">💖</span>
            <span class="heart-login" style="left:65%;animation-delay:1.5s;font-size:26px;">❤️‍🔥</span>
            <span class="heart-login" style="left:75%;animation-delay:3.5s;font-size:18px;">💕</span>
            <span class="heart-login" style="left:85%;animation-delay:4.5s;font-size:22px;">❤️</span>
            <span class="heart-login" style="left:95%;animation-delay:2.5s;font-size:16px;">💗</span>
        </div>

        <div class="login-card">
            <div class="login-card__header">
                <span class="icon">💎</span>
                <h1>Welcome Back</h1>
                <p>Log in to continue your journey to love</p>
            </div>

            <div class="error-message" id="error-message">⚠️ Invalid email or password.</div>
            <div class="success-message" id="success-message">✅ Login successful! Redirecting...</div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <div class="form-options">
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="login-btn">🔐 Log In</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </div>
    </main>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
            }
        }
    </script>

    <script type="module">
        import { createClient } from "@supabase/supabase-js";

        const SUPABASE_URL = 'https://eswlfgrzdmdwmfqncpew.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oeCfBt8Ci0xQ4mg6o2mnnA_mbgnwRVS';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('🔗 Supabase connected:', SUPABASE_URL);

        const form = document.getElementById('login-form');
        const btn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        function getRedirectTarget() {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect');
            if (redirect) {
                try {
                    const decoded = decodeURIComponent(redirect);
                    if (decoded.startsWith('/') || decoded.match(/^[a-zA-Z0-9_\-]+\.html/)) {
                        return decoded;
                    }
                } catch (e) {}
            }
            return 'members.html';
        }

        (async function checkSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session && session.user) {
                    console.log('✅ Already logged in:', session.user.email);
                    window.location.href = getRedirectTarget();
                }
            } catch (err) {
                console.warn('Session check failed:', err);
            }
        })();

        window.handleLogin = async function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            if (!email || !email.includes('@')) {
                errorMessage.textContent = '⚠️ Please enter a valid email address.';
                errorMessage.classList.add('show');
                return;
            }

            if (!password || password.length < 6) {
                errorMessage.textContent = '⚠️ Password must be at least 6 characters.';
                errorMessage.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Logging in...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    let msg = '⚠️ ';
                    if (error.message.includes('Invalid login credentials')) {
                        msg += 'Invalid email or password.';
                    } else if (error.message.includes('Email not confirmed')) {
                        msg += 'Email not confirmed. Please check your inbox.';
                    } else if (error.message.includes('Too many requests')) {
                        msg += 'Too many attempts. Please try again later.';
                    } else {
                        msg += error.message;
                    }
                    errorMessage.textContent = msg;
                    errorMessage.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = '🔐 Log In';
                    return;
                }

                if (!data || !data.user) {
                    errorMessage.textContent = '⚠️ Login failed. Please try again.';
                    errorMessage.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = '🔐 Log In';
                    return;
                }

                console.log('✅ Login successful:', data.user.email);

                successMessage.textContent = '✅ Login successful! Redirecting...';
                successMessage.classList.add('show');
                btn.textContent = '✅ Logged In!';
                btn.style.background = 'linear-gradient(135deg, #28a745, #1e7e34)';

                const target = getRedirectTarget();
                setTimeout(() => {
                    window.location.href = target;
                }, 900);

            } catch (err) {
                console.error('Unexpected login error:', err);
                errorMessage.textContent = '⚠️ Unexpected error. Please try again.';
                errorMessage.classList.add('show');
                btn.disabled = false;
                btn.textContent = '🔐 Log In';
            }
        }

        // Safe clear-messages-on-input (fixed)
        const emailEl = document.getElementById('email');
        const passwordEl = document.getElementById('password');

        if (emailEl) {
            emailEl.addEventListener('input', clearMessages);
        }
        if (passwordEl) {
            passwordEl.addEventListener('input', clearMessages);
        }

        function clearMessages() {
            if (errorMessage) errorMessage.classList.remove('show');
            if (successMessage) successMessage.classList.remove('show');
            if (btn) {
                btn.disabled = false;
                btn.textContent = '🔐 Log In';
                btn.style.background = '';
            }
        }

        console.log('💎 ClassyDate Login — Supabase Auth + Purple Theme');
    </script>

</body>
</html>
