<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ClassyDate</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f3e8ff;
            color: #1a0533;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ============================================================ */
        /* HEADER                                                       */
        /* ============================================================ */
        .login-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(108, 60, 179, 0.12);
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .login-header .brand {
            display: flex;
            align-items: center;
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 22px;
            font-weight: 700;
            color: #1a0533;
        }

        .login-header .brand .heart {
            color: #ff0000;
            display: inline-block;
        }

        .login-header .brand span {
            font-family: "Inter", sans-serif;
            font-weight: 300;
            color: #6c3cb3;
        }

        .login-header .admin-badge {
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            color: #fff;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            font-family: "Inter", sans-serif;
        }

        /* ============================================================ */
        /* MAIN                                                         */
        /* ============================================================ */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 60px;
            min-height: 100vh;
            background: radial-gradient(ellipse at center top, rgba(108, 60, 179, 0.06), transparent 70%);
        }

        .login-card {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 60px rgba(108, 60, 179, 0.12);
        }

        .login-card__header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-card__header .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .login-card__header h1 {
            font-family: "Playfair Display", Georgia, 'Times New Roman', serif;
            font-size: 28px;
            color: #1a0533;
            font-weight: 700;
        }

        .login-card__header p {
            color: rgba(26, 5, 51, 0.5);
            font-size: 14px;
            margin-top: 4px;
            font-family: "Inter", sans-serif;
        }

        /* ============================================================ */
        /* FORM                                                         */
        /* ============================================================ */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(26, 5, 51, 0.7);
            margin-bottom: 6px;
            font-family: "Inter", sans-serif;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(108, 60, 179, 0.15);
            border-radius: 12px;
            color: #1a0533;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            font-family: "Inter", sans-serif;
        }

        .form-group input::placeholder {
            color: rgba(26, 5, 51, 0.3);
        }

        .form-group input:focus {
            border-color: #6c3cb3;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 4px rgba(108, 60, 179, 0.1);
        }

        /* ============================================================ */
        /* BUTTON                                                       */
        /* ============================================================ */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6c3cb3, #4a1a6b);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "Inter", sans-serif;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 60, 179, 0.35);
            background: linear-gradient(135deg, #4a1a6b, #6c3cb3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================================ */
        /* ERROR                                                        */
        /* ============================================================ */
        .error-message {
            display: none;
            background: rgba(220, 53, 69, 0.08);
            border: 1px solid rgba(220, 53, 69, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #dc3545;
            font-size: 13px;
            margin-bottom: 16px;
            font-family: "Inter", sans-serif;
            font-weight: 500;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* ============================================================ */
        /* FOOTER LINK                                                  */
        /* ============================================================ */
        .login-footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(108, 60, 179, 0.08);
        }

        .login-footer p {
            color: rgba(26, 5, 51, 0.4);
            font-size: 13px;
            font-family: "Inter", sans-serif;
        }

        .login-footer a {
            color: #6c3cb3;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #4a1a6b;
            text-decoration: underline;
        }

        /* ============================================================ */
        /* TOAST                                                        */
        /* ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            background: #1a0533;
            color: #fff;
            border-radius: 12px;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            font-size: 14px;
            z-index: 999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: #28a745;
        }

        .toast.error {
            background: #dc3545;
        }

        /* ============================================================ */
        /* SPINNER                                                      */
        /* ============================================================ */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================ */
        /* RESPONSIVE                                                   */
        /* ============================================================ */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px 28px;
                border-radius: 20px;
            }
            .login-card__header h1 {
                font-size: 24px;
            }
            .login-header .brand {
                font-size: 18px;
            }
            .login-header {
                height: 58px;
                padding: 0 14px;
            }
            .toast {
                bottom: 20px;
                right: 20px;
                left: 20px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="login-header">
        <a class="brand" href="index.html" aria-label="ClassyDate">
            Classy<span>Date</span><span class="heart">❤️</span>
        </a>
        <div class="admin-badge">💎 ADMIN</div>
    </header>

    <!-- MAIN -->
    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-card__header">
                <span class="icon">🔑</span>
                <h1>Admin Login</h1>
                <p>Enter your credentials to access the admin panel</p>
            </div>

            <div class="error-message" id="error-message">
                ⚠️ Invalid email or password. Please try again.
            </div>

            <form id="login-form" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="admin@classydate.com" required autofocus autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login" id="login-btn">
                    <span class="spinner"></span>
                    <span class="btn-text">🔓 Login</span>
                </button>
            </form>

            <div class="login-footer">
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- SCRIPTS - Supabase Auth                                      -->
    <!-- ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
            }
        }
    </script>

    <script type="module">
        import { createClient } from "@supabase/supabase-js";

        const SUPABASE_URL = 'https://eswlfgrzdmdwmfqncpew.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oeCfBt8Ci0xQ4mg6o2mnnA_mbgnwRVS';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('🔗 Supabase connected:', SUPABASE_URL);

        // ============================================================
        // CHECK EXISTING SESSION
        // ============================================================
        async function checkExistingSession() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) return;

                if (session && session.user) {
                    const { data: adminRow } = await supabase
                        .from('admins')
                        .select('id, email')
                        .eq('id', session.user.id)
                        .maybeSingle();

                    if (adminRow) {
                        console.log('✅ Already logged in as admin');
                        window.location.href = 'adminpanel.html';
                    } else {
                        await supabase.auth.signOut();
                    }
                }
            } catch (err) {
                console.warn('Session check failed:', err);
            }
        }

        // ============================================================
        // HANDLE LOGIN
        // ============================================================
        window.handleLogin = async function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn');

            errorMessage.classList.remove('show');

            if (!email || !password) {
                errorMessage.textContent = '⚠️ Please fill in all fields.';
                errorMessage.classList.add('show');
                return false;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) {
                    let errorMsg = '⚠️ Login failed. ';
                    if (authError.message.includes('Invalid login credentials')) {
                        errorMsg += 'Invalid email or password.';
                    } else if (authError.message.includes('Email not confirmed')) {
                        errorMsg += 'Email not confirmed. Contact support.';
                    } else {
                        errorMsg += authError.message;
                    }

                    errorMessage.textContent = errorMsg;
                    errorMessage.classList.add('show');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    return false;
                }

                if (!authData.user) {
                    errorMessage.textContent = '⚠️ Login failed. No user returned.';
                    errorMessage.classList.add('show');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    return false;
                }

                // Verify admin
                const { data: adminRow, error: adminError } = await supabase
                    .from('admins')
                    .select('id, email')
                    .eq('id', authData.user.id)
                    .maybeSingle();

                if (adminError || !adminRow) {
                    errorMessage.textContent = '⛔ Access denied. Admin only!';
                    errorMessage.classList.add('show');
                    await supabase.auth.signOut();
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    return false;
                }

                console.log('✅ Admin verified:', adminRow.email);
                showToast('✅ Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'adminpanel.html';
                }, 1000);

            } catch (error) {
                console.error('Unexpected error:', error);
                errorMessage.textContent = '⚠️ Unexpected error: ' + error.message;
                errorMessage.classList.add('show');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }

            return false;
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // INIT
        // ============================================================
        checkExistingSession();

        console.log('🔐 Admin Login — Supabase + Purple Theme');
        console.log('🎨 Background: #f3e8ff | Primary: #6c3cb3');
        console.log('✅ Verifies admin via admins table');
    </script>

</body>
</html>
